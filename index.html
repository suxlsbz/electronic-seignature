<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告知书</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
            padding: 30px;
            position: relative;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .content-wrapper {
            height: calc(100vh - 340px);
            overflow-y: auto;
            margin-bottom: 40px;
            padding-right: 10px;
        }

        .content {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
        }

        .signature-section {
            position: relative;
            width: 150px;
            height: 80px;
            border-bottom: 2px solid #333;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signature-hint {
            font-size: 12px;
            color: #999;
            text-align: center;
        }

        .signature-label {
            font-size: 14px;
            color: #666;
            margin-right: 10px;
            width: 42px;
            text-align: left;
        }

        .date-value {
            font-size: 14px;
            color: #666;
            white-space: nowrap;
        }

        .signature-area-wrapper {
            position: absolute;
            right: 30px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
        }

        .signature-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .signature-row:last-child {
            margin-bottom: 0;
        }

        .signature-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background-color: #fff;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            padding: 20px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border: none;
            background-color: #f0f0f0;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            color: #666;
        }

        .modal-close:hover {
            background-color: #e0e0e0;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .canvas-container {
            border: 2px dashed #ddd;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
        }

        #signatureCanvas {
            width: 100%;
            display: block;
        }

        .modal-footer {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .btn-clear, .btn-confirm {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-clear {
            background-color: #f0f0f0;
            color: #666;
        }

        .btn-clear:hover {
            background-color: #e0e0e0;
        }

        .btn-confirm {
            background-color: #4CAF50;
            color: white;
        }

        .btn-confirm:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title" id="titleElement"></h1>
        <div class="content-wrapper">
            <div class="content" id="contentElement"></div>
        </div>
        <div class="signature-area-wrapper">
            <div class="signature-row">
                <div class="signature-label">签名：</div>
                <div class="signature-section" id="signatureArea" role="button" aria-label="电子签名区域">
                    <span class="signature-hint" id="signatureHint">点击此处开始签名</span>
                    <img id="signatureImage" class="signature-image" style="display: none;" alt="电子签名">
                </div>
            </div>
            <div class="signature-row">
                <div class="signature-label">日期：</div>
                <div class="date-value" id="dateLabel"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="signatureModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">手写签名</span>
                <button class="modal-close" id="btnClose">×</button>
            </div>
            <div class="modal-body">
                <div class="canvas-container">
                    <canvas id="signatureCanvas" width="400" height="200"></canvas>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-clear" id="btnClear">清空</button>
                <button class="btn-confirm" id="btnConfirm">确认</button>
            </div>
        </div>
    </div>

    <!-- Load content configuration -->
    <script src="content.js"></script>
    
    <script>
        // Initialize content after page loads
        document.addEventListener('DOMContentLoaded', function() {
            if (window.noticeTitle) {
                document.getElementById('titleElement').textContent = window.noticeTitle;
            }
            if (window.noticeContent) {
                document.getElementById('contentElement').innerHTML = window.noticeContent;
            }
            
            // Set current date (Beijing time)
            const now = new Date();
            // Calculate Beijing time offset (UTC+8)
            const beijingOffset = 8 * 60 * 60 * 1000;
            const utcTime = now.getTime() + now.getTimezoneOffset() * 60 * 1000;
            const beijingTime = new Date(utcTime + beijingOffset);
            const year = beijingTime.getUTCFullYear();
            const month = beijingTime.getUTCMonth() + 1;
            const day = beijingTime.getUTCDate();
            document.getElementById('dateLabel').textContent = year + '年' + month + '月' + day + '日';
        });

        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        const modal = document.getElementById('signatureModal');
        const btnClose = document.getElementById('btnClose');
        const btnClear = document.getElementById('btnClear');
        const btnConfirm = document.getElementById('btnConfirm');
        const signatureArea = document.getElementById('signatureArea');
        const signatureImage = document.getElementById('signatureImage');
        const signatureHint = document.getElementById('signatureHint');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            if (e.touches) {
                return {
                    x: (e.touches[0].clientX - rect.left) * scaleX,
                    y: (e.touches[0].clientY - rect.top) * scaleY
                };
            }
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPosition(e);
            lastX = pos.x;
            lastY = pos.y;
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPosition(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            lastX = pos.x;
            lastY = pos.y;
            e.preventDefault();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        signatureArea.addEventListener('click', () => {
            modal.classList.add('show');
        });

        btnClose.addEventListener('click', () => {
            modal.classList.remove('show');
        });

        btnClear.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        btnConfirm.addEventListener('click', () => {
            const imageData = canvas.toDataURL('image/png');
            signatureImage.src = imageData;
            signatureImage.style.display = 'block';
            signatureHint.style.display = 'none';
            modal.classList.remove('show');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('show');
            }
        });
    </script>
</body>
</html>
