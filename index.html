<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电子签名告知书</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
            padding: 30px;
            position: relative;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .content {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 40px;
        }

        .signature-section {
            position: absolute;
            right: 30px;
            bottom: 120px;
            width: 150px;
            height: 80px;
            border-bottom: 2px solid #333;
        }

        .signature-label {
            position: absolute;
            right: 30px;
            bottom: 80px;
            font-size: 14px;
            color: #666;
        }

        .signature-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-signature {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 45px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-signature:hover {
            background-color: #45a049;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background-color: #fff;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            padding: 20px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border: none;
            background-color: #f0f0f0;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            color: #666;
        }

        .modal-close:hover {
            background-color: #e0e0e0;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .canvas-container {
            border: 2px dashed #ddd;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
        }

        #signatureCanvas {
            width: 100%;
            display: block;
        }

        .modal-footer {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .btn-clear, .btn-confirm {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-clear {
            background-color: #f0f0f0;
            color: #666;
        }

        .btn-clear:hover {
            background-color: #e0e0e0;
        }

        .btn-confirm {
            background-color: #4CAF50;
            color: white;
        }

        .btn-confirm:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">XX告知书</h1>
        <div class="content">
            本人已仔细阅读并理解本告知书的全部内容，确认已知悉相关权利和义务。
        </div>
        <div class="signature-label">签名：</div>
        <div class="signature-section" id="signatureArea">
            <img id="signatureImage" class="signature-image" style="display: none;">
        </div>
        <button class="btn-signature" id="btnSignature">签名</button>
    </div>

    <div class="modal-overlay" id="signatureModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">手写签名</span>
                <button class="modal-close" id="btnClose">×</button>
            </div>
            <div class="modal-body">
                <div class="canvas-container">
                    <canvas id="signatureCanvas" width="400" height="200"></canvas>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-clear" id="btnClear">清空</button>
                <button class="btn-confirm" id="btnConfirm">确认</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        const modal = document.getElementById('signatureModal');
        const btnSignature = document.getElementById('btnSignature');
        const btnClose = document.getElementById('btnClose');
        const btnClear = document.getElementById('btnClear');
        const btnConfirm = document.getElementById('btnConfirm');
        const signatureArea = document.getElementById('signatureArea');
        const signatureImage = document.getElementById('signatureImage');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            if (e.touches) {
                return {
                    x: (e.touches[0].clientX - rect.left) * scaleX,
                    y: (e.touches[0].clientY - rect.top) * scaleY
                };
            }
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPosition(e);
            lastX = pos.x;
            lastY = pos.y;
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPosition(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            lastX = pos.x;
            lastY = pos.y;
            e.preventDefault();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        btnSignature.addEventListener('click', () => {
            modal.classList.add('show');
        });

        btnClose.addEventListener('click', () => {
            modal.classList.remove('show');
        });

        btnClear.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        btnConfirm.addEventListener('click', () => {
            const imageData = canvas.toDataURL('image/png');
            signatureImage.src = imageData;
            signatureImage.style.display = 'block';
            modal.classList.remove('show');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('show');
            }
        });
    </script>
</body>
</html>
